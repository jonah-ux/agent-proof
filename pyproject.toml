[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_proof"
version = "0.1.0"
description = "evidence bundle builder"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Jonah Helland"}]
dependencies = []

[project.scripts]
agent-proof = "agent_proof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
