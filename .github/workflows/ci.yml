name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m pip install build
      - run: python -m build --sdist --wheel
      - run: python -m unittest discover -s tests -v
      - run: python -m agent_proof.cli --version
      - run: python demos/demo.py
      - name: Verify installed wheel consumer
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/agent-proof-wheel"
          "$RUNNER_TEMP/agent-proof-wheel/bin/python" -m pip install --no-deps dist/agent_proof-*.whl
          "$RUNNER_TEMP/agent-proof-wheel/bin/agent-proof" --version
          "$RUNNER_TEMP/agent-proof-wheel/bin/agent-proof" --help
          "$RUNNER_TEMP/agent-proof-wheel/bin/agent-proof" capture --out "$RUNNER_TEMP/agent-proof-capture.json"
      - name: Verify installed sdist consumer
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/agent-proof-sdist"
          "$RUNNER_TEMP/agent-proof-sdist/bin/python" -m pip install --no-deps dist/agent_proof-*.tar.gz
          "$RUNNER_TEMP/agent-proof-sdist/bin/agent-proof" --version
          "$RUNNER_TEMP/agent-proof-sdist/bin/agent-proof" --help
          "$RUNNER_TEMP/agent-proof-sdist/bin/agent-proof" capture --out "$RUNNER_TEMP/agent-proof-sdist-capture.json"
