name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m pip install build
      - run: python -m build --sdist --wheel
      - name: Verify source-distribution conformance resources
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          required = {"conformance/native-receipts.json", "conformance/compatibility-v1.json", "conformance/agent-systems-lab.json", "conformance/forgeyard-ai-work-evidence-v1.json"}
          with tarfile.open(next(Path("dist").glob("*.tar.gz"))) as archive:
              names = {"/".join(PurePosixPath(member.name).parts[1:]) for member in archive if member.isfile()}
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Source distribution missing conformance resources: {missing}")
          print("Source distribution contains native fixtures and existing conformance corpora")
          PY
      - run: python -m unittest discover -s tests -v
      - name: Validate Agent Systems Lab compatibility charter
        run: python scripts/check_compatibility.py --manifest conformance/compatibility-v1.json
      - run: python -m agent_proof.cli --version
      - run: python demos/demo.py
      - name: Verify installed wheel consumer
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/agent-proof-wheel"
          "$RUNNER_TEMP/agent-proof-wheel/bin/python" -m pip install --no-deps dist/agent_proof-*.whl
          "$RUNNER_TEMP/agent-proof-wheel/bin/agent-proof" --version
          "$RUNNER_TEMP/agent-proof-wheel/bin/agent-proof" --help
          "$RUNNER_TEMP/agent-proof-wheel/bin/agent-proof" capture --out "$RUNNER_TEMP/agent-proof-capture.json"
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$RUNNER_TEMP/agent-proof-wheel/bin/python" -c 'from pathlib import Path; import sys, agent_proof; source = Path(agent_proof.__file__).resolve(); assert source.is_relative_to(Path(sys.prefix).resolve()), source; print(source)'
          "$RUNNER_TEMP/agent-proof-wheel/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_native_adapters.py -v
          "$RUNNER_TEMP/agent-proof-wheel/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_graph.py -v
      - name: Verify installed sdist consumer
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/agent-proof-sdist"
          "$RUNNER_TEMP/agent-proof-sdist/bin/python" -m pip install --no-deps dist/agent_proof-*.tar.gz
          "$RUNNER_TEMP/agent-proof-sdist/bin/agent-proof" --version
          "$RUNNER_TEMP/agent-proof-sdist/bin/agent-proof" --help
          "$RUNNER_TEMP/agent-proof-sdist/bin/agent-proof" capture --out "$RUNNER_TEMP/agent-proof-sdist-capture.json"
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$RUNNER_TEMP/agent-proof-sdist/bin/python" -c 'from pathlib import Path; import sys, agent_proof; source = Path(agent_proof.__file__).resolve(); assert source.is_relative_to(Path(sys.prefix).resolve()), source; print(source)'
          "$RUNNER_TEMP/agent-proof-sdist/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_native_adapters.py -v
          "$RUNNER_TEMP/agent-proof-sdist/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_graph.py -v
