name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh annotated release tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag):
              raise SystemExit("release tag must be vMAJOR.MINOR.PATCH")
          with open("pyproject.toml", "rb") as handle:
              version = tomllib.load(handle)["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match project version {version}")
          tag_type = subprocess.check_output(["git", "cat-file", "-t", f"refs/tags/{tag}"], text=True).strip()
          if tag_type != "tag":
              raise SystemExit("release tag must be annotated")
          tag_commit = subprocess.check_output(["git", "rev-parse", f"refs/tags/{tag}^{{}}"], text=True).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if tag_commit != head:
              raise SystemExit("release tag does not identify the checked-out HEAD")
          print(f"Release identity verified: {tag} -> {head}")
          PY
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --wheel
          sha256sum dist/* > dist/SHA256SUMS
      - name: Verify source contracts
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
          python scripts/check_compatibility.py --manifest conformance/compatibility-v1.json
      - name: Verify wheel consumer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/agent-proof-release-wheel"
          "$RUNNER_TEMP/agent-proof-release-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$RUNNER_TEMP/agent-proof-release-wheel/bin/python" -c 'from pathlib import Path; import os, sys, agent_proof; from importlib.metadata import version; source = Path(agent_proof.__file__).resolve(); assert source.is_relative_to(Path(sys.prefix).resolve()), source; assert agent_proof.__version__ == version("agent_proof") == os.environ["RELEASE_TAG"][1:]; print(source, agent_proof.__version__)'
          "$RUNNER_TEMP/agent-proof-release-wheel/bin/agent-proof" --version
          "$RUNNER_TEMP/agent-proof-release-wheel/bin/agent-proof" --help
          "$RUNNER_TEMP/agent-proof-release-wheel/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_native_adapters.py -v
          "$RUNNER_TEMP/agent-proof-release-wheel/bin/python" "$GITHUB_WORKSPACE/demos/demo.py" > agent-proof-release-wheel-demo.json
          "$RUNNER_TEMP/agent-proof-release-wheel/bin/python" -c 'import json; from pathlib import Path; result = json.loads(Path("agent-proof-release-wheel-demo.json").read_text()); required = ("ok", "verified", "tamper_refused", "bundle_verified", "bundle_tamper_refused", "graph_verified", "graph_tamper_refused", "bundle_graph_verified", "interop_verified"); assert all(result.get(key) is True for key in required), result; assert result.get("interop_source_state") == "verified", result; print(json.dumps(result, sort_keys=True))'
      - name: Verify source consumer
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/agent-proof-release-sdist"
          "$RUNNER_TEMP/agent-proof-release-sdist/bin/python" -m pip install --no-deps dist/*.tar.gz
          cd "$RUNNER_TEMP"
          unset PYTHONPATH
          "$RUNNER_TEMP/agent-proof-release-sdist/bin/python" -c 'from pathlib import Path; import os, sys, agent_proof; from importlib.metadata import version; source = Path(agent_proof.__file__).resolve(); assert source.is_relative_to(Path(sys.prefix).resolve()), source; assert agent_proof.__version__ == version("agent_proof") == os.environ["RELEASE_TAG"][1:]; print(source, agent_proof.__version__)'
          "$RUNNER_TEMP/agent-proof-release-sdist/bin/agent-proof" --version
          "$RUNNER_TEMP/agent-proof-release-sdist/bin/agent-proof" --help
          "$RUNNER_TEMP/agent-proof-release-sdist/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_native_adapters.py -v
          "$RUNNER_TEMP/agent-proof-release-sdist/bin/python" "$GITHUB_WORKSPACE/demos/demo.py" > agent-proof-release-sdist-demo.json
          "$RUNNER_TEMP/agent-proof-release-sdist/bin/python" -c 'import json; from pathlib import Path; result = json.loads(Path("agent-proof-release-sdist-demo.json").read_text()); required = ("ok", "verified", "tamper_refused", "bundle_verified", "bundle_tamper_refused", "graph_verified", "graph_tamper_refused", "bundle_graph_verified", "interop_verified"); assert all(result.get(key) is True for key in required), result; assert result.get("interop_source_state") == "verified", result; print(json.dumps(result, sort_keys=True))'
      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "${{ github.repository }} ${{ github.ref_name }}" \
            --generate-notes \
            --prerelease
